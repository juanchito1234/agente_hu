<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditor de Historias de Usuario · Groq</title>
  
  <!-- Google Fonts & Marked library for markdown parsing -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <!-- Layout Wrapper -->
  <div class="app-container" id="appContainer">
    
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-header">
        <div class="sb-logo">⚡ HU Auditor</div>
        <button class="sb-collapse-btn" id="collapseSidebarBtn" title="Contraer panel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>

      <div class="sb-content">
        <!-- Section: API Keys -->
        <div class="sb-section">
          <label class="sb-label">API KEYS GROQ</label>
          <div class="select-wrapper">
            <select id="keySelect" class="custom-select"></select>
          </div>
          <div class="sb-status" id="keyStatus">✅ 0 keys cargadas</div>

          <div class="key-input-group">
            <input type="password" id="newKeyInput" placeholder="gsk_..." class="custom-input">
            <button id="toggleEyeBtn" class="icon-btn" title="Revelar/ocultar key">👁️</button>
          </div>

          <div class="sb-actions">
            <button id="addKeyBtn" class="btn btn-accent-dim">＋ Agregar</button>
            <button id="removeKeyBtn" class="btn btn-danger-dim" title="Eliminar seleccionada">✕</button>
          </div>
        </div>

        <hr class="sb-divider">

        <!-- Section: Modelo -->
        <div class="sb-section">
          <label class="sb-label">MODELO SELECCIONADO</label>
          <div class="select-wrapper">
            <select id="modelSelect" class="custom-select"></select>
          </div>
        </div>

        <hr class="sb-divider">

        <!-- Section: Status -->
        <div class="sb-section">
          <div class="sb-info-card" id="globalStatus">
            <span>Estado: Listo</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Botón flotante para reabrir Sidebar -->
    <button class="sidebar-expand-btn" id="expandSidebarBtn" title="Abrir panel lateral" style="display: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="main-header">
        <div class="header-top">
          <div>
            <span class="badge">⚡ Groq · INVEST Framework</span>
            <h1>Asesor de Historias de Usuario & Arquitectura</h1>
            <p>Chat interactivo con memoria persistente para auditar, refinar y generar Historias de Usuario.</p>
          </div>
          <button id="newChatBtn" class="btn btn-secondary" title="Reiniciar conversación">
            <span>➕ Nuevo Chat</span>
          </button>
        </div>
      </header>

      <!-- Chat Stream Feed -->
      <div class="chat-feed" id="chatFeed">
        <!-- Los mensajes se renderizarán dinámicamente -->
      </div>

      <!-- Footer Sticky Chat Input -->
      <div class="chat-input-container">
        <div class="input-wrapper">
          <textarea id="storyInput" class="custom-textarea chat-textarea" rows="2" placeholder="Escribe tu mensaje o pega una Historia de Usuario para auditar... (Shift+Enter para salto de línea)"></textarea>
          <button id="generateBtn" class="btn btn-primary send-btn" title="Enviar mensaje">
            <span class="btn-text">Enviar 🚀</span>
            <span class="spinner" id="spinner" style="display: none;"></span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
